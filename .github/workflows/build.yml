name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # This project (SwiftUI + Core Data + CloudKit, built as a Swift Playgrounds
    # "App" package via AppleProductTypes) can only be compiled on macOS with
    # Xcode's iOS SDKs — there is no Linux toolchain that provides UIKit,
    # SwiftUI, CoreData or CloudKit. This is the only place in CI (or anywhere
    # in this project's normal dev loop, until the Mac arrives) that actually
    # invokes the compiler.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Deliberately no `xcode-select`: pinning to a specific Xcode version
      # (e.g. 16.2) can select one whose paired iOS Simulator runtime isn't
      # pre-cached on this runner image, even though other runtimes are. The
      # image's default Xcode is the one guaranteed to have its own iOS
      # runtime available without an on-demand download.
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: List available schemes and destinations
        run: xcodebuild -scheme Ledger -showdestinations

      - name: Resolve an available iOS Simulator destination
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable)][0].udid')
          echo "Selected simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build (Ledger app, iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Ledger \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          echo "----- build.log tail -----"
          tail -n 200 build.log

      - name: Run tests (LedgerTests, iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Ledger \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log
          echo "----- test.log tail -----"
          tail -n 200 test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
